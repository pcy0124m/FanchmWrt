name: Build FanchmWrt

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "设备 profile（留空 = 京东云亚瑟 RE-SP-01B）"
        required: false
        default: "jdcloud_re-sp-01b"
  push:
    branches: [main]
    paths:
      - "configs/**"
      - "files/**"
      - ".github/workflows/build-fanchmwrt.yml"
  release:
    types: [published]

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-25.12
  CONFIG_FILE: configs/fanchmwrt-ramips-mt7621.seed
  FILES_DIR: files
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          # 注意：绝对不要删 /etc/apt/sources.list.d/ —— Ubuntu 24.04 的 apt 源就在里面
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -hT

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3-setuptools python3-ply python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget ccache device-tree-compiler \
            cmake ninja-build llvm lld libelf-dev libgmp-dev libmpc-dev libmpfr-dev \
            libreadline-dev libtool libyaml-dev libz-dev xz-utils zstd squashfs-tools \
            curl patch pkgconf subversion gperf help2man texinfo re2c cpio binutils
          # 可选依赖：装不上也不影响主流程

      - name: 克隆 OpenWrt 源码
        run: |
          git clone --depth 1 --branch $REPO_BRANCH $REPO_URL openwrt

      - name: 拉取 Argon 主题（第三方）
        run: |
          cd openwrt
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon package/luci-theme-argon
          git clone --depth 1 https://github.com/jerrykuku/luci-app-argon-config package/luci-app-argon-config

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 注入 FanchmWrt 配置与定制文件
        run: |
          cd openwrt
          cp -f $GITHUB_WORKSPACE/$CONFIG_FILE .config
          if [ -d "$GITHUB_WORKSPACE/$FILES_DIR" ]; then
            cp -rf $GITHUB_WORKSPACE/$FILES_DIR/. files/ 2>/dev/null || {
              mkdir -p files
              cp -rf $GITHUB_WORKSPACE/$FILES_DIR/. files/
            }
          fi
          make defconfig
          ./scripts/diffconfig.sh > seed.conf
          cat seed.conf

      - name: 下载软件源码包
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) 线程编译中，预计 2~3 小时"
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          ls -lh bin/targets/ramips/mt7621/

      - name: 整理产物
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/ramips/mt7621
          rm -rf packages
          mkdir -p $GITHUB_WORKSPACE/output
          cp -f * $GITHUB_WORKSPACE/output/ 2>/dev/null || true
          cd $GITHUB_WORKSPACE
          VERSION=$(grep '^CONFIG_VERSION_NUMBER' openwrt/.config | cut -d'"' -f2 || echo "snapshot")
          echo "FANCHMWRT_VERSION=${VERSION}-$(date +%Y%m%d%H%M)" >> $GITHUB_ENV

      - name: 上传 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FanchmWrt-${{ env.FANCHMWRT_VERSION }}
          path: output/
          retention-days: 30

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        if: steps.compile.outputs.status == 'success'
        with:
          tag_name: v${{ env.FANCHMWRT_VERSION }}
          name: FanchmWrt ${{ env.FANCHMWRT_VERSION }}
          make_latest: true
          files: output/*.bin
          body: |
            FanchmWrt ${{ env.FANCHMWRT_VERSION }} · 京东云无线宝一代（亚瑟 RE-SP-01B，MT7621）

            | 文件 | 用途 |
            |---|---|
            | `*-squashfs-sysupgrade.bin` | 正式固件（breed / OpenWrt 内升级用） |
            | `*-initramfs-kernel.bin` | 临时启动测试（不写 flash，重启即失） |

            ⚠️ 官方 bootloader 不认第三方固件，刷机需先烧 breed 不死引导，详见 README。
